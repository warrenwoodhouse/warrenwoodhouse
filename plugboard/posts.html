<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plugs - Plugboard - Warren Woodhouse</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
        .result-card { background: #f4f4f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Submission Received</h2>
    
    <div class="result-card">
        <p><strong>Website Icon:</strong> <span id="displaybutton"></span></p>
        <p><strong>Website Name:</strong> <span id="displayusername"></span></p>
        <p><strong>Website URL:</strong> <span id="displaywebsite"></span></p>
    </div>

    <p><a href="index.html">← Back to the Plugboard</a></p>

    <script>
        // Extract parameters from the page URL (e.g., ?username=John&email=john@example.com)
        const urlParams = new URLSearchParams(window.location.search);

        // Retrieve values by their 'name' attributes from index.html
        const button = urlParams.get('button');
        const username = urlParams.get('username');
        const website = urlParams.get('website');

        // Render the values onto the page
        document.getElementById('displaybutton').textContent = button || 'Not provided';
        document.getElementById('displayusername').textContent = username || 'Not provided';
        document.getElementById('displaywebsite').textContent = website || 'Not provided';
    </script>
</body>
</html>
