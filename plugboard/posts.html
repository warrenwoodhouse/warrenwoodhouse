<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plugs - Plugboard - Warren Woodhouse</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; }
        .result-card { background: #f4f4f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Submission Received</h2>
    
    <div class="result-card">
        <p><strong>Full Name:</strong> <span id="displayName"></span></p>
        <p><strong>Email:</strong> <span id="displayEmail"></span></p>
    </div>

    <p><a href="index.html">← Back to the Plugboard</a></p>

    <script>
        // Extract parameters from the page URL (e.g., ?username=John&email=john@example.com)
        const urlParams = new URLSearchParams(window.location.search);

        // Retrieve values by their 'name' attributes from index.html
        const username = urlParams.get('username');
        const email = urlParams.get('email');

        // Render the values onto the page
        document.getElementById('displayName').textContent = username || 'Not provided';
        document.getElementById('displayEmail').textContent = email || 'Not provided';
    </script>
</body>
</html>
