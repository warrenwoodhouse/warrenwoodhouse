<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SYSTEM // OMNI-TOOL AUDIO SUBROUTINE</title>
  <style>
    :root {
      --me-cyan: #00f0ff;
      --me-orange: #ff6600;
      --me-dark: #080c14;
      --me-panel: rgba(10, 20, 35, 0.85);
      --me-glow: 0 0 10px rgba(0, 240, 255, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; }

    body {
      background-color: var(--me-dark);
      color: var(--me-cyan);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 80%),
        linear-gradient(rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 50%);
      background-size: 100% 100%, 100% 4px;
    }

    /* Mass Effect HUD Container */
    .hud-container {
      width: 450px;
      padding: 25px;
      background: var(--me-panel);
      border: 1px solid var(--me-cyan);
      box-shadow: var(--me-glow), inset 0 0 15px rgba(0, 240, 255, 0.2);
      clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 100%, 8% 100%, 0 92%);
      position: relative;
    }

    /* N7 / Cerberus Header Accent */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--me-cyan);
      padding-bottom: 10px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hud-header h1 { font-size: 1.1rem; text-shadow: var(--me-glow); }
    .status-tag { font-size: 0.7rem; color: var(--me-orange); font-weight: bold; }

    /* Playlist Input */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--me-cyan);
      color: #fff;
      padding: 8px 12px;
      outline: none;
      font-size: 0.8rem;
    }

    /* Track Display */
    .screen {
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed var(--me-cyan);
      padding: 15px;
      margin-bottom: 20px;
      min-height: 70px;
    }

    .track-title {
      color: #fff;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress & Volume */
    .bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      margin-top: 12px;
      position: relative;
      cursor: pointer;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--me-cyan);
      box-shadow: var(--me-glow);
    }

    /* Control Buttons */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    button {
      flex: 1;
      background: transparent;
      border: 1px solid var(--me-cyan);
      color: var(--me-cyan);
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      clip-path: polygon(0 0, 85% 0, 100% 30%, 100% 100%, 15% 100%, 0 70%);
    }

    button:hover {
      background: var(--me-cyan);
      color: var(--me-dark);
      box-shadow: var(--me-glow);
    }

    /* Hidden YouTube Player */
    #yt-player { display: none; }
  </style>
</head>
<body>

  <div class="hud-container">
    <div class="hud-header">
      <h1>OMNI-AUDIO v3.4</h1>
      <span class="status-tag" id="status">OFFLINE</span>
    </div>

    <div class="input-group">
      <input type="text" id="playlist-id" placeholder="Paste YouTube Playlist ID">
      <button onclick="loadPlaylist()" style="flex:0.4;">LOAD</button>
    </div>

    <div class="screen">
      <div style="font-size: 0.7rem; color: var(--me-orange); margin-bottom: 5px;">CURRENT AUDIO TRANSMISSION:</div>
      <div class="track-title" id="track-title">AWAITING SIGNAL...</div>
      <div class="bar-container" onclick="seek(event)">
        <div class="bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="controls">
      <button onclick="prevTrack()">PREV</button>
      <button onclick="togglePlay()" id="play-btn">PLAY</button>
      <button onclick="nextTrack()">NEXT</button>
    </div>
  </div>

  <div id="yt-player"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '0',
        width: '0',
        playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1},
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function loadPlaylist() {
      const id = document.getElementById('playlist-id').value.trim();
      if (!id) return;
      
      player.loadPlaylist({
        list: id,
        listType: 'playlist',
        index: 0,
        startSeconds: 0
      });
      document.getElementById('status').innerText = 'CONNECTED';
      document.getElementById('status').style.color = 'var(--me-cyan)';
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function nextTrack() { if (player) player.nextVideo(); }
    function prevTrack() { if (player) player.previousVideo(); }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        document.getElementById('play-btn').innerText = 'PAUSE';
        updateTrackInfo();
      } else {
        isPlaying = false;
        document.getElementById('play-btn').innerText = 'PLAY';
      }
    }

    function updateTrackInfo() {
      setInterval(() => {
        if (player && isPlaying) {
          const data = player.getVideoData();
          document.getElementById('track-title').innerText = data.title || 'AUDIO TRANSMISSION Active';
          
          const currentTime = player.getCurrentTime();
          const duration = player.getDuration();
          if (duration > 0) {
            const pct = (currentTime / duration) * 100;
            document.getElementById('progress-bar').style.width = pct + '%';
          }
        }
      }, 1000);
    }

    function seek(event) {
      if (!player || !player.getDuration()) return;
      const bar = event.currentTarget;
      const clickX = event.offsetX;
      const width = bar.clientWidth;
      const duration = player.getDuration();
      player.seekTo((clickX / width) * duration, true);
    }
  </script>
</body>
</html>
