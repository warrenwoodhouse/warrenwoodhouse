<style>
    body {
        background-color: #ffffff; /* To make the banner pop */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    .banner {
        background-color: #2b2b2b; /* Dark grey background */
        display: flex;
        align-items: center;
        padding: 15px 40px;
        border-top: 2px solid #1a1a1a;
        border-bottom: 2px solid #1a1a1a;
        width: 100%;
        max-width: 800px;
        box-sizing: border-box;
    }

    .text-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: right;
        flex-grow: 1;
        padding-right: 20px;
    }

    .title {
        color: #e0e0e0;
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 1px;
        margin-bottom: -5px;
        text-shadow: 1px 1px 2px #000;
    }

    .subtitle {
        color: #999;
        font-size: 18px;
        font-weight: 400;
        text-shadow: 1px 1px 2px #000;
    }

    .chevron {
        color: #555;
        font-size: 40px;
        font-weight: 100;
        padding: 0 20px;
        text-shadow: 1px 1px 2px #000;
        transform: scaleY(1.5); /* Stretches the chevron slightly to match */
    }

    .timer-container {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 150px;
    }

    .timer {
        color: #d0d0d0;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 2px;
        text-shadow: 1px 1px 2px #000;
    }
</style>

<body>

<div class="banner">
    <div class="text-container">
        <div class="title">GOT YOUR ZOMBREX?</div>
        <div class="subtitle">Time your next injection</div>
    </div>
    <div class="chevron">&gt;</div>
    <div class="timer-container">
        <div class="timer" id="countdown">24:00:00</div>
    </div>
</div>

<script>
    function updateTimer() {
        // Get current time
        const now = new Date();
        
        // Calculate the next midnight
        const nextMidnight = new Date(now);
        nextMidnight.setHours(24, 0, 0, 0); 
        
        // Find the difference in milliseconds, then convert to seconds
        const diffInSeconds = Math.floor((nextMidnight - now) / 1000);

        // Calculate hours, minutes, and seconds
        let hours = Math.floor(diffInSeconds / 3600);
        let minutes = Math.floor((diffInSeconds % 3600) / 60);
        let seconds = diffInSeconds % 60;

        // Pad with leading zeros if necessary (e.g., 9 becomes "09")
        hours = hours < 10 ? '0' + hours : hours;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        // Display the result
        document.getElementById('countdown').innerText = `${hours}:${minutes}:${seconds}`;
    }

    // Initialize the timer immediately, then update it every second
    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
